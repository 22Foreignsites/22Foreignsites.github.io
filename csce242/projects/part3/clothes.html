<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes - The Foreign Collective</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar top">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="merch.html">Merch</a></li>
            <li><a href="volunteer.html">Volunteer</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="scholarship.html">Scholarship</a></li>
        </ul>
    </nav>
    <header>
        <h1>Clothes</h1>
    </header>
    <main>
        <section class="clothes-categories">
            <div class="clothes-row">
                <div class="clothes-col">
                    <img src="https://dummyimage.com/200x120?text=Shirts" alt="Shirts" class="clothes-img" />
                    <div class="clothes-label"><a href="shirts.html">Shirts</a></div>
                </div>
                <div class="clothes-col">
                    <img src="https://dummyimage.com/200x120?text=Pants" alt="Pants" class="clothes-img" />
                    <div class="clothes-label"><a href="pants.html">Pants</a></div>
                </div>
                <div class="clothes-col">
                    <img src="https://dummyimage.com/200x120?text=Hats" alt="Hats" class="clothes-img" />
                    <div class="clothes-label"><a href="hats.html">Hats</a></div>
                </div>
                <div class="clothes-col">
                    <img src="https://dummyimage.com/200x120?text=Hoodies" alt="Hoodies" class="clothes-img" />
                    <div class="clothes-label"><a href="hoodies.html">Hoodies</a></div>
                </div>
            </div>
        </section>
        <section class="popular-section">
            <div class="popular-btn">What's popular now</div>
            <div class="popular-row">
                <div class="popular-card">
                    <img src="https://dummyimage.com/200x120?text=Foreigners-A" alt="Foreigners-A" class="popular-img" />
                    <div class="popular-label">Foreigners–A</div>
                    <div class="popular-price">$230</div>
                </div>
                <div class="popular-card">
                    <img src="https://dummyimage.com/200x120?text=Foreign_Hoods" alt="Foreign_Hoods" class="popular-img" />
                    <div class="popular-label">Foreign_Hoods</div>
                    <div class="popular-price">$140</div>
                </div>
                <div class="popular-card">
                    <img src="https://dummyimage.com/200x120?text=FF-Hat" alt="FF-Hat" class="popular-img" />
                    <div class="popular-label">FF–Hat</div>
                    <div class="popular-price">$30</div>
                </div>
                <div class="popular-card">
                    <img src="https://dummyimage.com/200x120?text=FF-243" alt="FF-243" class="popular-img" />
                    <div class="popular-label">FF–#243</div>
                    <div class="popular-price">$40</div>
                </div>
                <div class="popular-card">
                    <img src="https://dummyimage.com/200x120?text=Outback-Pants" alt="Outback-Pants" class="popular-img" />
                    <div class="popular-label">Outback–Pants</div>
                    <div class="popular-price">$123</div>
                </div>
            </div>
        </section>
    </main>
    <nav class="navbar bottom">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="merch.html">Merch</a></li>
            <li><a href="volunteer.html">Volunteer</a></li>
            <li><a href="scholarship.html">Scholarship</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
